# Tollgate freeze. Written by /tollgate:init. Do not edit by hand.
# Started by hand on the main branch. Job "test" runs the tests of the change
# with a read-only token. Job "lock" runs none of that code and creates the tag.
name: tollgate freeze
on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Ticket id. The branch is tg/<ticket id>.
        required: true
permissions: {}
concurrency:
  group: tollgate-freeze-${{ inputs.ticket }}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.head.outputs.commit }}
    steps:
      - name: Refuse a run outside the main branch or a bad ticket id
        env:
          TICKET: ${{ inputs.ticket }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
          [[ "$TICKET" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || exit 1
      - uses: actions/checkout@v4
        with:
          ref: tg/${{ inputs.ticket }}
          fetch-depth: 0
          persist-credentials: false
      - id: head
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: mohamed-rekiba/tollgate/action@__TOLLGATE_REF__
        with:
          command: prepare
          args: --base origin/main
      - uses: mohamed-rekiba/tollgate/action@__TOLLGATE_REF__
        with:
          command: checks
          args: --base origin/main --setup --only tests --out ${{ runner.temp }}/results.json
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: ${{ runner.temp }}/results.json
  lock:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: results
          path: ${{ runner.temp }}/in
      - uses: mohamed-rekiba/tollgate/action@__TOLLGATE_REF__
        with:
          command: freeze
          args: >-
            --ticket ${{ inputs.ticket }} --commit ${{ needs.test.outputs.commit }}
            --results ${{ runner.temp }}/in/results.json --run-id ${{ github.run_id }}
            --out ${{ runner.temp }}/tag.txt --name-out ${{ runner.temp }}/name.txt
      - name: Create the freeze tag
        env:
          COMMIT: ${{ needs.test.outputs.commit }}
        run: |
          name="$(cat "$RUNNER_TEMP/name.txt")"
          git -c user.name="tollgate freeze" -c user.email="tollgate@users.noreply.github.com" \
            tag -a "$name" -F "$RUNNER_TEMP/tag.txt" "$COMMIT"
          git push origin "refs/tags/$name"
