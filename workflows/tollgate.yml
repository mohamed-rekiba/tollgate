# Tollgate. Written by /tollgate:init. This file does not change when Tollgate
# changes: it reads "version" from .tollgate/settings.json on the main branch,
# "self" (this repository is Tollgate), "copy" (Tollgate's code is copied into
# .tollgate/runner/, for an organization that allows only local actions), or a
# full commit id of Tollgate.
#
# Started by hand (workflow_dispatch): a freeze or a plan lock.
# On a pull request into main, or a comment "tollgate check" or "tollgate approve":
# the tests, then the review, then the gate, which posts "tollgate gate".
# A job that runs the change has a read-only token, no secrets, and no saved token.
name: tollgate
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('tollgate {0} {1}', inputs.kind, inputs.id)
      || format('tollgate check #{0}', github.event.pull_request.number || github.event.issue.number) }}
on:
  workflow_dispatch:
    inputs:
      kind:
        description: freeze or plan
        required: true
        type: choice
        options: [freeze, plan]
      id:
        description: The ticket id (freeze) or task id (plan).
        required: true
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
permissions: {}
concurrency:
  # One freeze or plan lock at a time for each id. Pull request runs do not queue.
  group: ${{ github.event_name == 'workflow_dispatch' && format('tollgate-{0}-{1}', inputs.kind, inputs.id) || github.run_id }}
jobs:
  # Freeze, job one: run the ticket's tests with a read-only token.
  freeze-test:
    if: github.event_name == 'workflow_dispatch' && inputs.kind == 'freeze'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.head.outputs.commit }}
    steps:
      - name: Refuse a run outside main or a bad id
        env:
          ID: ${{ inputs.id }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
          [[ "$ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || exit 1
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0
          persist-credentials: false
      - name: Get Tollgate's code
        id: code
        run: |
          v="$(python3 -c 'import json,sys; print(json.load(open("main/.tollgate/settings.json")).get("version",""))')"
          if [[ "$v" == self ]]; then
            echo "path=$GITHUB_WORKSPACE/main" >> "$GITHUB_OUTPUT"
          elif [[ "$v" == copy ]]; then
            echo "path=$GITHUB_WORKSPACE/main/.tollgate/runner" >> "$GITHUB_OUTPUT"
          elif [[ "$v" =~ ^[0-9a-f]{40}$ ]]; then
            echo "path=$GITHUB_WORKSPACE/tollgate" >> "$GITHUB_OUTPUT"
            echo "ref=$v" >> "$GITHUB_OUTPUT"
          else
            echo "Set \"version\" in .tollgate/settings.json to \"self\", \"copy\", or a full commit id of Tollgate."
            exit 1
          fi
      - if: steps.code.outputs.ref != ''
        uses: actions/checkout@v4
        with:
          repository: mohamed-rekiba/tollgate
          ref: ${{ steps.code.outputs.ref }}
          path: tollgate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: tg/${{ inputs.id }}
          path: change
          fetch-depth: 0
          persist-credentials: false
      - id: head
        run: echo "commit=$(git -C change rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Put back the harness from main
        env:
          PYTHONPATH: ${{ steps.code.outputs.path }}
        run: python3 -P -m action.prepare --repo change --base origin/main
      - name: Run the tests
        env:
          PYTHONPATH: ${{ steps.code.outputs.path }}
        run: python3 -P -m action.checks --repo change --base origin/main --setup --only tests --out "$RUNNER_TEMP/results.json"
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: ${{ runner.temp }}/results.json
  # Freeze, job two: runs none of the change's code, and creates the tag.
  freeze-lock:
    needs: freeze-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0
          persist-credentials: true
      - name: Get Tollgate's code
        id: code
        run: |
          v="$(python3 -c 'import json,sys; print(json.load(open("main/.tollgate/settings.json")).get("version",""))')"
          if [[ "$v" == self ]]; then
            echo "path=$GITHUB_WORKSPACE/main" >> "$GITHUB_OUTPUT"
          elif [[ "$v" == copy ]]; then
            echo "path=$GITHUB_WORKSPACE/main/.tollgate/runner" >> "$GITHUB_OUTPUT"
          elif [[ "$v" =~ ^[0-9a-f]{40}$ ]]; then
            echo "path=$GITHUB_WORKSPACE/tollgate" >> "$GITHUB_OUTPUT"
            echo "ref=$v" >> "$GITHUB_OUTPUT"
          else
            echo "Set \"version\" in .tollgate/settings.json to \"self\", \"copy\", or a full commit id of Tollgate."
            exit 1
          fi
      - if: steps.code.outputs.ref != ''
        uses: actions/checkout@v4
        with:
          repository: mohamed-rekiba/tollgate
          ref: ${{ steps.code.outputs.ref }}
          path: tollgate
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: results
          path: ${{ runner.temp }}/in
      - name: Build the manifest
        env:
          PYTHONPATH: ${{ steps.code.outputs.path }}
          ID: ${{ inputs.id }}
          COMMIT: ${{ needs.freeze-test.outputs.commit }}
        run: python3 -P -m action.freeze --repo main --ticket "$ID" --commit "$COMMIT" --results "$RUNNER_TEMP/in/results.json" --run-id "$GITHUB_RUN_ID" --out "$RUNNER_TEMP/tag.txt" --name-out "$RUNNER_TEMP/name.txt"
      - name: Create the freeze tag
        env:
          COMMIT: ${{ needs.freeze-test.outputs.commit }}
        run: |
          name="$(cat "$RUNNER_TEMP/name.txt")"
          git -C main -c user.name="tollgate freeze" -c user.email="tollgate@users.noreply.github.com" \
            tag -a "$name" -F "$RUNNER_TEMP/tag.txt" "$COMMIT"
          git -C main push origin "refs/tags/$name"
      # The gate compares the tag with this copy, which only this run could upload.
      - uses: actions/upload-artifact@v4
        with:
          name: tollgate-manifest
          path: ${{ runner.temp }}/tag.txt
          retention-days: 90
  # Plan lock: reads the plan and its tickets as files, and creates the tag.
  plan-lock:
    if: github.event_name == 'workflow_dispatch' && inputs.kind == 'plan'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Refuse a run outside main or a bad id
        env:
          ID: ${{ inputs.id }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
          [[ "$ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || exit 1
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0
          persist-credentials: true
      - name: Get Tollgate's code
        id: code
        run: |
          v="$(python3 -c 'import json,sys; print(json.load(open("main/.tollgate/settings.json")).get("version",""))')"
          if [[ "$v" == self ]]; then
            echo "path=$GITHUB_WORKSPACE/main" >> "$GITHUB_OUTPUT"
          elif [[ "$v" == copy ]]; then
            echo "path=$GITHUB_WORKSPACE/main/.tollgate/runner" >> "$GITHUB_OUTPUT"
          elif [[ "$v" =~ ^[0-9a-f]{40}$ ]]; then
            echo "path=$GITHUB_WORKSPACE/tollgate" >> "$GITHUB_OUTPUT"
            echo "ref=$v" >> "$GITHUB_OUTPUT"
          else
            echo "Set \"version\" in .tollgate/settings.json to \"self\", \"copy\", or a full commit id of Tollgate."
            exit 1
          fi
      - if: steps.code.outputs.ref != ''
        uses: actions/checkout@v4
        with:
          repository: mohamed-rekiba/tollgate
          ref: ${{ steps.code.outputs.ref }}
          path: tollgate
          persist-credentials: false
      - id: head
        env:
          ID: ${{ inputs.id }}
        run: |
          git -C main fetch --no-tags origin "refs/heads/tg-plan/$ID"
          echo "commit=$(git -C main rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build the plan tag
        env:
          PYTHONPATH: ${{ steps.code.outputs.path }}
          ID: ${{ inputs.id }}
          COMMIT: ${{ steps.head.outputs.commit }}
        run: python3 -P -m action.plantag --repo main --task "$ID" --commit "$COMMIT" --run-id "$GITHUB_RUN_ID" --out "$RUNNER_TEMP/tag.txt" --name-out "$RUNNER_TEMP/name.txt"
      - name: Create the plan tag
        env:
          COMMIT: ${{ steps.head.outputs.commit }}
        run: |
          name="$(cat "$RUNNER_TEMP/name.txt")"
          git -C main -c user.name="tollgate plan" -c user.email="tollgate@users.noreply.github.com" \
            tag -a "$name" -F "$RUNNER_TEMP/tag.txt" "$COMMIT"
          git -C main push origin "refs/tags/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: tollgate-manifest
          path: ${{ runner.temp }}/tag.txt
          retention-days: 90
  # A pull request: find it, and check its branch name.
  find:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, 'tollgate approve ') ||
        startsWith(github.event.comment.body, 'tollgate check')))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      sha: ${{ steps.pr.outputs.sha }}
      branch: ${{ steps.pr.outputs.branch }}
      ticket: ${{ steps.pr.outputs.ticket }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          data="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")"
          # Only a pull request into the main branch gets a gate result.
          if [[ "$(jq -r .base.ref <<<"$data")" != main ]]; then exit 0; fi
          branch="$(jq -r .head.ref <<<"$data")"
          # A branch name is text from the author of the change. Only a plain
          # ticket branch goes on. Any other name fails gate rule 1.
          [[ "$branch" =~ ^tg/[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || branch="not-a-ticket-branch"
          {
            echo "pr=$PR"
            echo "sha=$(jq -r .head.sha <<<"$data")"
            echo "branch=$branch"
            echo "ticket=${branch#tg/}"
          } >> "$GITHUB_OUTPUT"
  # Run the change's tests with a read-only token and no secrets.
  test:
    needs: find
    if: needs.find.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0
          persist-credentials: false
      - name: Get Tollgate's code
        id: code
        run: |
          v="$(python3 -c 'import json,sys; print(json.load(open("main/.tollgate/settings.json")).get("version",""))')"
          if [[ "$v" == self ]]; then
            echo "path=$GITHUB_WORKSPACE/main" >> "$GITHUB_OUTPUT"
          elif [[ "$v" == copy ]]; then
            echo "path=$GITHUB_WORKSPACE/main/.tollgate/runner" >> "$GITHUB_OUTPUT"
          elif [[ "$v" =~ ^[0-9a-f]{40}$ ]]; then
            echo "path=$GITHUB_WORKSPACE/tollgate" >> "$GITHUB_OUTPUT"
            echo "ref=$v" >> "$GITHUB_OUTPUT"
          else
            echo "Set \"version\" in .tollgate/settings.json to \"self\", \"copy\", or a full commit id of Tollgate."
            exit 1
          fi
      - if: steps.code.outputs.ref != ''
        uses: actions/checkout@v4
        with:
          repository: mohamed-rekiba/tollgate
          ref: ${{ steps.code.outputs.ref }}
          path: tollgate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.find.outputs.sha }}
          path: change
          fetch-depth: 0
          persist-credentials: false
      - name: Put back the harness from main and the locked files
        env:
          PYTHONPATH: ${{ steps.code.outputs.path }}
          TICKET: ${{ needs.find.outputs.ticket }}
        run: python3 -P -m action.prepare --repo change --base origin/main --ticket "$TICKET"
      - name: Run the checks
        env:
          PYTHONPATH: ${{ steps.code.outputs.path }}
        run: python3 -P -m action.checks --repo change --base origin/main --setup --out "$RUNNER_TEMP/results.json"
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: ${{ runner.temp }}/results.json
  # The review reads the change as text. It holds the model access.
  review:
    needs: find
    if: needs.find.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0
          persist-credentials: false
      - name: Get Tollgate's code
        id: code
        run: |
          v="$(python3 -c 'import json,sys; print(json.load(open("main/.tollgate/settings.json")).get("version",""))')"
          if [[ "$v" == self ]]; then
            echo "path=$GITHUB_WORKSPACE/main" >> "$GITHUB_OUTPUT"
          elif [[ "$v" == copy ]]; then
            echo "path=$GITHUB_WORKSPACE/main/.tollgate/runner" >> "$GITHUB_OUTPUT"
          elif [[ "$v" =~ ^[0-9a-f]{40}$ ]]; then
            echo "path=$GITHUB_WORKSPACE/tollgate" >> "$GITHUB_OUTPUT"
            echo "ref=$v" >> "$GITHUB_OUTPUT"
          else
            echo "Set \"version\" in .tollgate/settings.json to \"self\", \"copy\", or a full commit id of Tollgate."
            exit 1
          fi
      - if: steps.code.outputs.ref != ''
        uses: actions/checkout@v4
        with:
          repository: mohamed-rekiba/tollgate
          ref: ${{ steps.code.outputs.ref }}
          path: tollgate
          persist-credentials: false
      - name: Fetch the change as data
        env:
          PR: ${{ needs.find.outputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C main -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            fetch --no-tags origin "refs/pull/$PR/head"
      - name: Work out the tier
        env:
          PYTHONPATH: ${{ steps.code.outputs.path }}
          SHA: ${{ needs.find.outputs.sha }}
          BRANCH: ${{ needs.find.outputs.branch }}
        run: python3 -P -m action.review --repo main --base origin/main --head "$SHA" --branch "$BRANCH" --tier-out "$RUNNER_TEMP/tier.txt"
      - id: tier
        run: echo "tier=$(cat "$RUNNER_TEMP/tier.txt")" >> "$GITHUB_OUTPUT"
      # Newer npm skips install scripts unless they are allowed.
      - name: Install Claude Code for tier 3 and 4
        if: steps.tier.outputs.tier >= 3
        run: |
          npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@2.1.330
          claude --version
      - name: Review
        env:
          PYTHONPATH: ${{ steps.code.outputs.path }}
          SHA: ${{ needs.find.outputs.sha }}
          BRANCH: ${{ needs.find.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          # Either one works. An unset secret arrives as an empty string.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 -P -m action.review --repo main --base origin/main --head "$SHA" --branch "$BRANCH" --repository "$GITHUB_REPOSITORY" --post "$SHA"
  # The gate runs after the tests and the review, so it reads their results.
  gate:
    needs: [find, test, review]
    if: always() && needs.find.result == 'success' && needs.find.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0
          persist-credentials: false
      - name: Get Tollgate's code
        id: code
        run: |
          v="$(python3 -c 'import json,sys; print(json.load(open("main/.tollgate/settings.json")).get("version",""))')"
          if [[ "$v" == self ]]; then
            echo "path=$GITHUB_WORKSPACE/main" >> "$GITHUB_OUTPUT"
          elif [[ "$v" == copy ]]; then
            echo "path=$GITHUB_WORKSPACE/main/.tollgate/runner" >> "$GITHUB_OUTPUT"
          elif [[ "$v" =~ ^[0-9a-f]{40}$ ]]; then
            echo "path=$GITHUB_WORKSPACE/tollgate" >> "$GITHUB_OUTPUT"
            echo "ref=$v" >> "$GITHUB_OUTPUT"
          else
            echo "Set \"version\" in .tollgate/settings.json to \"self\", \"copy\", or a full commit id of Tollgate."
            exit 1
          fi
      - if: steps.code.outputs.ref != ''
        uses: actions/checkout@v4
        with:
          repository: mohamed-rekiba/tollgate
          ref: ${{ steps.code.outputs.ref }}
          path: tollgate
          persist-credentials: false
      - name: Fetch the change as data
        env:
          PR: ${{ needs.find.outputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C main -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            fetch --no-tags origin "refs/pull/$PR/head"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: results
          path: ${{ runner.temp }}/in
      - name: Mark missing results as a failed check
        run: |
          f="$RUNNER_TEMP/in/results.json"
          mkdir -p "$RUNNER_TEMP/in"
          test -f "$f" || echo '{"checks":[{"name":"checks","passed":false,"timed_out":false,"output":"the test job did not finish"}],"tests":{}}' > "$f"
      - name: Gate
        env:
          PYTHONPATH: ${{ steps.code.outputs.path }}
          SHA: ${{ needs.find.outputs.sha }}
          BRANCH: ${{ needs.find.outputs.branch }}
          PR: ${{ needs.find.outputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -P -m action.gate --repo main --base origin/main --head "$SHA" --branch "$BRANCH" --results "$RUNNER_TEMP/in/results.json" --repository "$GITHUB_REPOSITORY" --pr "$PR" --post "$SHA"
