<svg xmlns="http://www.w3.org/2000/svg" viewBox="-149 -24 867 1247" width="867" height="1247" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title id="title">A task from start to finish</title>
<desc id="desc">You say what you want. The AI reads the project first, and each fact cites the code. It writes a plan, which fresh AIs check; an assumption in the plan goes to the advisor. It cuts the plan into small tickets. For each ticket: the tests are written and locked first, and the AI builds until it scores 70%, each time from its best try. After 3 tries, it asks the advisor: a second AI, or you. The gate passes the change, and it is merged; you merge the risky ones. After the last ticket, a review reads the whole task. You read the report, and up to 3 lessons become rules for the next task.</desc>
