<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 663 740" width="663" height="740" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
<title id="title">A task from start to finish</title>
<desc id="desc">You say what you want. The AI writes a plan, which other AIs check. The plan is cut into small tickets. For each ticket, tests are written and locked, the AI builds until they pass, and the server checks again and merges. You read the report. When the AI is stuck, the advisor decides.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect x="-12" y="-12" width="663" height="740" fill="#0d1117"/>
<line x1="174.9" y1="66.0" x2="174.9" y2="122.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="174.9" y1="183.0" x2="174.9" y2="239.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="174.9" y1="281.0" x2="174.9" y2="337.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="174.9" y1="379.0" x2="174.9" y2="435.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="174.9" y1="496.0" x2="174.9" y2="552.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="174.9" y1="594.0" x2="174.9" y2="650.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="270.3" y1="465.5" x2="409.8" y2="465.5" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="318.1" y="454.5" width="44.0" height="20" rx="4" fill="#0d1117"/>
<text x="340.1" y="469.5" text-anchor="middle" font-size="13" fill="#e6edf3">stuck</text>
<rect x="72.1" y="24.0" width="205.6" height="42.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="174.9" y="49.7" text-anchor="middle" fill="#e6edf3">1. You say what you want</text>
<rect x="35.1" y="122.0" width="279.6" height="61.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="174.9" y="147.7" text-anchor="middle" fill="#e6edf3" font-weight="600">2. The AI writes a plan</text>
<text x="174.9" y="166.7" text-anchor="middle" fill="#e6edf3">Other AIs with fresh eyes check it</text>
<rect x="24.0" y="239.0" width="301.8" height="42.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="174.9" y="264.7" text-anchor="middle" fill="#e6edf3">3. The plan is cut into small tickets</text>
<rect x="46.2" y="337.0" width="257.4" height="42.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="174.9" y="362.7" text-anchor="middle" fill="#e6edf3">4. Tests are written and locked</text>
<rect x="79.5" y="435.0" width="190.8" height="61.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="174.9" y="460.7" text-anchor="middle" fill="#e6edf3" font-weight="600">5. The AI builds until</text>
<text x="174.9" y="479.7" text-anchor="middle" fill="#e6edf3">the locked tests pass</text>
<rect x="24.0" y="552.0" width="301.8" height="42.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="174.9" y="577.7" text-anchor="middle" fill="#e6edf3">6. The server checks again and merges</text>
<rect x="79.5" y="650.0" width="190.8" height="42.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="174.9" y="675.7" text-anchor="middle" fill="#e6edf3">7. You read the report</text>
<rect x="409.8" y="435.0" width="205.6" height="61.0" rx="8" fill="#0c2d6b" stroke="#8b949e" stroke-width="1.4"/>
<text x="512.6" y="460.7" text-anchor="middle" fill="#e6edf3" font-weight="600">The advisor decides</text>
<text x="512.6" y="479.7" text-anchor="middle" fill="#e6edf3">A person, or a second AI</text>
</svg>
