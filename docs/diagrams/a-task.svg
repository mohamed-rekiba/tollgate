<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 -22 669 844" width="669" height="844" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">A task from start to finish</title>
<desc id="desc">You say what you want. The AI writes a plan, which fresh AIs check. The plan is cut into small tickets. For each ticket, tests are written and locked, the AI builds until they pass, and the server checks again and merges. You read the report. When the AI is stuck, the advisor decides.</desc>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 L3.2,5 z" fill="#818b98"/></marker><marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 L3.2,5 z" fill="#cf222e"/></marker><marker id="arrow-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 L3.2,5 z" fill="#1a7f37"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#1f2328" flood-opacity="0.07"/></filter></defs>
<rect x="-21.5" y="-21.5" width="668" height="843" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
<path d="M137.0,80.0 L137.0,120.0" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<path d="M137.0,200.0 L137.0,240.0" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<path d="M137.0,320.0 L137.0,360.0" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<path d="M137.0,440.0 L137.0,480.0" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<path d="M137.0,560.0 L137.0,600.0" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<path d="M137.0,680.0 L137.0,720.0" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<path d="M274.0,520.0 L351.0,520.0" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#arrow-plain)"/>
<rect x="0.0" y="0.0" width="274.0" height="80.0" rx="10" fill="#f3f8ff" stroke="#0969da" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
<clipPath id="clip0"><rect x="0.0" y="0.0" width="274.0" height="80.0" rx="10"/></clipPath>
<rect x="0.0" y="0.0" width="4" height="80.0" fill="#0969da" clip-path="url(#clip0)"/>
<text x="22.0" y="24.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#0969da">STEP 1 · YOU</text>
<text x="22.0" y="44.0" font-size="15" font-weight="600" fill="#1f2328">You say what you want</text>
<text x="22.0" y="63.0" font-size="13" fill="#59636e">In plain words</text>
<rect x="0.0" y="120.0" width="274.0" height="80.0" rx="10" fill="#f9f6ff" stroke="#8250df" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
<clipPath id="clip1"><rect x="0.0" y="120.0" width="274.0" height="80.0" rx="10"/></clipPath>
<rect x="0.0" y="120.0" width="4" height="80.0" fill="#8250df" clip-path="url(#clip1)"/>
<text x="22.0" y="144.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#8250df">STEP 2 · AI</text>
<text x="22.0" y="164.0" font-size="15" font-weight="600" fill="#1f2328">The AI writes a plan</text>
<text x="22.0" y="183.0" font-size="13" fill="#59636e">Fresh AIs check it</text>
<rect x="0.0" y="240.0" width="274.0" height="80.0" rx="10" fill="#f9f6ff" stroke="#8250df" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
<clipPath id="clip2"><rect x="0.0" y="240.0" width="274.0" height="80.0" rx="10"/></clipPath>
<rect x="0.0" y="240.0" width="4" height="80.0" fill="#8250df" clip-path="url(#clip2)"/>
<text x="22.0" y="264.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#8250df">STEP 3 · AI</text>
<text x="22.0" y="284.0" font-size="15" font-weight="600" fill="#1f2328">The plan is cut into tickets</text>
<text x="22.0" y="303.0" font-size="13" fill="#59636e">Each one small</text>
<rect x="0.0" y="360.0" width="274.0" height="80.0" rx="10" fill="#f2fbf4" stroke="#1a7f37" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
<clipPath id="clip3"><rect x="0.0" y="360.0" width="274.0" height="80.0" rx="10"/></clipPath>
<rect x="0.0" y="360.0" width="4" height="80.0" fill="#1a7f37" clip-path="url(#clip3)"/>
<text x="22.0" y="384.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#1a7f37">STEP 4 · SERVER</text>
<text x="22.0" y="404.0" font-size="15" font-weight="600" fill="#1f2328">Tests are written and locked</text>
<text x="22.0" y="423.0" font-size="13" fill="#59636e">Before any code</text>
<rect x="0.0" y="480.0" width="274.0" height="80.0" rx="10" fill="#f9f6ff" stroke="#8250df" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
<clipPath id="clip4"><rect x="0.0" y="480.0" width="274.0" height="80.0" rx="10"/></clipPath>
<rect x="0.0" y="480.0" width="4" height="80.0" fill="#8250df" clip-path="url(#clip4)"/>
<text x="22.0" y="504.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#8250df">STEP 5 · AI</text>
<text x="22.0" y="524.0" font-size="15" font-weight="600" fill="#1f2328">The AI builds</text>
<text x="22.0" y="543.0" font-size="13" fill="#59636e">Until the locked tests pass</text>
<rect x="0.0" y="600.0" width="274.0" height="80.0" rx="10" fill="#f2fbf4" stroke="#1a7f37" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
<clipPath id="clip5"><rect x="0.0" y="600.0" width="274.0" height="80.0" rx="10"/></clipPath>
<rect x="0.0" y="600.0" width="4" height="80.0" fill="#1a7f37" clip-path="url(#clip5)"/>
<text x="22.0" y="624.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#1a7f37">STEP 6 · SERVER</text>
<text x="22.0" y="644.0" font-size="15" font-weight="600" fill="#1f2328">The server checks and merges</text>
<text x="22.0" y="663.0" font-size="13" fill="#59636e">It runs the tests again</text>
<rect x="0.0" y="720.0" width="274.0" height="80.0" rx="10" fill="#f3f8ff" stroke="#0969da" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
<clipPath id="clip6"><rect x="0.0" y="720.0" width="274.0" height="80.0" rx="10"/></clipPath>
<rect x="0.0" y="720.0" width="4" height="80.0" fill="#0969da" clip-path="url(#clip6)"/>
<text x="22.0" y="744.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#0969da">STEP 7 · YOU</text>
<text x="22.0" y="764.0" font-size="15" font-weight="600" fill="#1f2328">You read the report</text>
<text x="22.0" y="783.0" font-size="13" fill="#59636e">Done, and still to do</text>
<rect x="351.0" y="480.0" width="274.0" height="80.0" rx="10" fill="#fff5ee" stroke="#bc4c00" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
<clipPath id="clip7"><rect x="351.0" y="480.0" width="274.0" height="80.0" rx="10"/></clipPath>
<rect x="351.0" y="480.0" width="4" height="80.0" fill="#bc4c00" clip-path="url(#clip7)"/>
<text x="373.0" y="504.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#bc4c00">ADVISOR</text>
<text x="373.0" y="524.0" font-size="15" font-weight="600" fill="#1f2328">The advisor decides</text>
<text x="373.0" y="543.0" font-size="13" fill="#59636e">A second AI, or you</text>
<rect x="288.0" y="509.0" width="49.0" height="22" rx="11.0" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<text x="312.5" y="524.2" text-anchor="middle" font-size="12" font-weight="500" fill="#59636e">stuck</text>
</svg>
