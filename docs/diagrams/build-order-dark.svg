<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 1447 133" width="1447" height="133" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
<title id="title">The build order in five stages</title>
<desc id="desc">Stage 0, experiments: you know the design holds. Stage 1, the lock: you protect a change by hand. Stage 2, the loop: Tollgate builds one ticket. Stage 3, the task: you give a task and read a report. Stage 4, scale: large requests and many projects.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect x="-12" y="-12" width="1447" height="133" fill="#0d1117"/>
<line x1="170.4" y1="54.5" x2="240.4" y2="54.5" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="475.6" y1="54.5" x2="545.6" y2="54.5" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="766.0" y1="54.5" x2="836.0" y2="54.5" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="1086.0" y1="54.5" x2="1156.0" y2="54.5" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="24.0" y="24.0" width="146.4" height="61.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="97.2" y="49.7" text-anchor="middle" fill="#e6edf3" font-weight="600">0. Experiments</text>
<text x="97.2" y="68.7" text-anchor="middle" fill="#e6edf3">The design holds</text>
<rect x="240.4" y="24.0" width="235.2" height="61.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="358.0" y="49.7" text-anchor="middle" fill="#e6edf3" font-weight="600">1. The lock</text>
<text x="358.0" y="68.7" text-anchor="middle" fill="#e6edf3">You protect a change by hand</text>
<rect x="545.6" y="24.0" width="220.4" height="61.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="655.8" y="49.7" text-anchor="middle" fill="#e6edf3" font-weight="600">2. The loop</text>
<text x="655.8" y="68.7" text-anchor="middle" fill="#e6edf3">Tollgate builds one ticket</text>
<rect x="836.0" y="24.0" width="250.0" height="61.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="961.0" y="49.7" text-anchor="middle" fill="#e6edf3" font-weight="600">3. The task</text>
<text x="961.0" y="68.7" text-anchor="middle" fill="#e6edf3">You give a task, read a report</text>
<rect x="1156.0" y="24.0" width="242.6" height="61.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="1277.3" y="49.7" text-anchor="middle" fill="#e6edf3" font-weight="600">4. Scale</text>
<text x="1277.3" y="68.7" text-anchor="middle" fill="#e6edf3">Large requests, many projects</text>
</svg>
