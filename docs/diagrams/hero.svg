<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title id="title">Tollgate: let AI write your code, merge only what works</title>
<desc id="desc">A banner. On the left: Tollgate, a plugin for Claude Code. Let AI write your code, and merge only what works: tests are written before the code, the AI cannot change them, and nothing reaches the main branch until they pass. On the right, an isometric drawing: a change leaves the AI and stops at the gate while the tests run. They fail, and it goes back to the AI on a red path. It comes again, it scores 70% or more, the barrier lifts, and it goes into the main branch.</desc>
