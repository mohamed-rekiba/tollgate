<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 1164 152" width="1164" height="152" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
<title id="title">The four tiers</title>
<desc id="desc">Tier 1 is a small fix with locked tests. Tier 2 is a normal change, with locked tests, a plan, and a review. Tier 3 covers login, payments, and user data, and adds a review on the server. Tier 4 covers data, production, and the locks, and adds an approval by a person.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="-12" y="-12" width="1164" height="152" fill="#ffffff"/>
<line x1="140.8" y1="64.0" x2="210.8" y2="64.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="460.8" y1="64.0" x2="530.8" y2="64.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="780.8" y1="64.0" x2="850.8" y2="64.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="24.0" y="24.0" width="116.8" height="80.0" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.4"/>
<text x="82.4" y="49.7" text-anchor="middle" fill="#1f2328" font-weight="600">Tier 1</text>
<text x="82.4" y="68.7" text-anchor="middle" fill="#1f2328">A small fix</text>
<text x="82.4" y="87.7" text-anchor="middle" fill="#1f2328">Locked tests</text>
<rect x="210.8" y="24.0" width="250.0" height="80.0" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.4"/>
<text x="335.8" y="49.7" text-anchor="middle" fill="#1f2328" font-weight="600">Tier 2</text>
<text x="335.8" y="68.7" text-anchor="middle" fill="#1f2328">A normal change</text>
<text x="335.8" y="87.7" text-anchor="middle" fill="#1f2328">Locked tests, a plan, a review</text>
<rect x="530.8" y="24.0" width="250.0" height="80.0" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.4"/>
<text x="655.8" y="49.7" text-anchor="middle" fill="#1f2328" font-weight="600">Tier 3</text>
<text x="655.8" y="68.7" text-anchor="middle" fill="#1f2328">Login, payments, user data</text>
<text x="655.8" y="87.7" text-anchor="middle" fill="#1f2328">All of tier 2, a server review</text>
