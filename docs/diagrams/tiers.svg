<text x="983.2" y="49.7" text-anchor="middle" fill="#1f2328" font-weight="600">Tier 4</text>
<text x="983.2" y="68.7" text-anchor="middle" fill="#1f2328">Data, production, the locks</text>
<text x="983.2" y="87.7" text-anchor="middle" fill="#1f2328">All of tier 3, a person approves</text>
