<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 -22 628 204" width="628" height="204" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">Where each part runs</title>
<desc id="desc">On your machine runs the plugin: the skills you type in Claude Code, the driver that runs the steps, and the instructions for each AI role. On the server runs the workflow: the freeze that locks the tests, and the gate that runs them. The plugin starts the workflow, and the workflow reports back.</desc>
