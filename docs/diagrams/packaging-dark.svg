<text x="22.0" y="24.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#4493f8">YOUR MACHINE</text>
<text x="22.0" y="44.0" font-size="15" font-weight="600" fill="#f0f6fc">The plugin</text>
