<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title id="title">Where each part runs</title>
<desc id="desc">An isometric scene in two parts. On your machine runs the plugin: the commands you type in Claude Code, the driver, which runs each step and the gate, and the instructions for each AI role. On GitHub runs one workflow: it locks the tests, and runs them again on every change. The plugin starts the workflow, and the workflow reports back.</desc>
