<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -54 1080 803" width="1080" height="803" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title id="title">Dynamic diagram for One ticket in background mode</title>
<desc id="desc">One ticket in background mode, in order: you type the task, your session starts the driver, the driver has the store lock the tests and starts the builder in its copy, the builder works with the model, the driver runs the gate, the gate reads the lock from the store, and the store merges the ready change into your project.</desc>
