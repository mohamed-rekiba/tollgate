<text x="14.0" y="293.0" font-size="14" font-weight="700" fill="#f0f6fc">GitHub</text>
<text x="14.0" y="311.0" font-size="12" fill="#9198a1">[External System]</text>
<text x="14.0" y="328.0" font-size="12" fill="#9198a1">Holds your project's</text>
<text x="14.0" y="345.0" font-size="12" fill="#9198a1">main branch</text>
</g>
