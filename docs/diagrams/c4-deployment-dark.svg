<svg xmlns="http://www.w3.org/2000/svg" viewBox="-56 -142 1217 815" width="1217" height="815" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title id="title">Deployment diagram for Tollgate</title>
<desc id="desc">Everything runs on your machine. In session mode your Claude Code session asks the driver for each step and runs the role itself. In background mode the driver starts each role in Docker, with only its copy. The store keeps its records in the state folder. Only the prompts leave the machine, to the model.</desc>
