<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 -24 1110 339" width="1110" height="339" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title id="title">How one ticket is built</title>
<desc id="desc">The AI builds one attempt and runs the locked tests on its own machine. On a pass, the change goes to the server, which runs the tests again. On a fail, the AI tries again with what went wrong. After 3 tries, or when stuck, it asks the advisor.</desc>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 L3.2,5 z" fill="#818b98"/></marker><marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 L3.2,5 z" fill="#cf222e"/></marker><marker id="arrow-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 L3.2,5 z" fill="#1a7f37"/></marker><pattern id="grid" x="12" y="-24" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#eef1f4" stroke-width="1"/></pattern></defs>
<style>.main{stroke-width:2.6;stroke-dasharray:0 7;animation:flow 0.8s linear infinite}.side{stroke-width:1.6;stroke-dasharray:6 5;animation:side 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-7}}@keyframes side{to{stroke-dashoffset:-11}}@media (prefers-reduced-motion:reduce){.main,.side{animation:none}.ticket{display:none}}</style>
<rect x="12" y="-24" width="1110" height="339" fill="#ffffff"/>
<rect x="12" y="-24" width="1110" height="339" fill="url(#grid)"/>
<path class="main" d="M257.1,77.3 L420.4,77.3" fill="none" stroke="#818b98" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<path class="main" d="M713.0,77.3 L876.3,77.3" fill="none" stroke="#1a7f37" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-pass)"/>
<path class="main" d="M566.7,154.6 L566.7,204.6" fill="none" stroke="#cf222e" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-fail)"/>
<path class="main" d="M455.9,247.6 L158.3,247.6 Q146.3,247.6 146.3,235.6 L146.3,120.3" fill="none" stroke="#818b98" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<path class="side" d="M677.5,247.6 L876.3,247.6" fill="none" stroke="#818b98" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<rect x="35.5" y="34.3" width="221.6" height="86.0" rx="43.0" fill="#f9f6ff" stroke="#8250df" stroke-width="1.3" stroke-linejoin="round"/>
<g transform="translate(125.8,47.3) scale(0.7500)" fill="none" stroke="#8250df" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.5l1.9 5.1L18 10.5l-5.1 1.9L11 17.5l-1.9-5.1L4 10.5l5.1-1.9z"/><path d="M18.5 15l.8 2.2l2.2.8l-2.2.8l-.8 2.2l-.8-2.2l-2.2-.8l2.2-.8z"/></g>
<text x="151.8" y="60.3" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#8250df">AI</text>
<text x="146.3" y="87.3" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">The AI builds</text>
<text x="146.3" y="105.3" text-anchor="middle" font-size="12" fill="#59636e">One attempt</text>
<polygon points="566.7,0.0 713.0,77.3 566.7,154.6 420.4,77.3" fill="#fff9e5" stroke="#9a6700" stroke-width="1.3" stroke-linejoin="round"/>
<g transform="translate(535.0,38.8) scale(0.7500)" fill="none" stroke="#9a6700" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6.5l-5.2 8.7A1.9 1.9 0 0 0 6.4 21h11.2a1.9 1.9 0 0 0 1.6-2.8L14 9.5V3"/><path d="M7.4 15h9.2"/></g>
<text x="561.0" y="51.8" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#9a6700">CHECK</text>
<text x="566.7" y="78.8" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">Do the tests pass?</text>
<text x="566.7" y="96.8" text-anchor="middle" font-size="12" fill="#59636e">The locked ones,</text>
<text x="566.7" y="113.8" text-anchor="middle" font-size="12" fill="#59636e">on the AI's machine</text>
<rect x="876.3" y="34.3" width="221.6" height="86.0" rx="43.0" fill="#f2fbf4" stroke="#1a7f37" stroke-width="1.3" stroke-linejoin="round"/>
<g transform="translate(951.6,47.3) scale(0.7500)" fill="none" stroke="#1a7f37" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4a2 2 0 1 0 0 4a2 2 0 1 0 0-4z"/><path d="M6 16a2 2 0 1 0 0 4a2 2 0 1 0 0-4z"/><path d="M18 16a2 2 0 1 0 0 4a2 2 0 1 0 0-4z"/><path d="M6 8v8"/><path d="M18 16v-6a3 3 0 0 0-3-3h-4"/><path d="M13 4.5L10.5 7L13 9.5"/></g>
<text x="977.6" y="60.3" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#1a7f37">SERVER</text>
<text x="987.1" y="87.3" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">Send to the server</text>
<text x="987.1" y="105.3" text-anchor="middle" font-size="12" fill="#59636e">It runs the tests again</text>
<rect x="455.9" y="204.6" width="221.6" height="86.0" rx="4" fill="#f9f6ff" stroke="#8250df" stroke-width="1.3" stroke-linejoin="round"/>
<path d="M464.9,200.6 H451.9 V213.6" fill="none" stroke="#8250df" stroke-width="1.2"/>
<path d="M668.5,294.6 H681.5 V281.6" fill="none" stroke="#8250df" stroke-width="1.2"/>
<g transform="translate(469.9,216.6) scale(0.7500)" fill="none" stroke="#8250df" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5v5h5"/><path d="M4.8 9.5A7.5 7.5 0 1 1 6 16.2"/></g>
<text x="495.9" y="229.6" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#8250df">AI</text>
<text x="469.9" y="256.6" font-size="14" font-weight="700" fill="#1f2328">Try again</text>
<text x="469.9" y="274.6" font-size="12" fill="#59636e">With what went wrong</text>
<path d="M876.3,204.6 H1054.9 A43.0,43.0 0 0 1 1054.9,290.6 H876.3 Z" fill="#fff5ee" stroke="#bc4c00" stroke-width="1.3" stroke-linejoin="round"/>
<g transform="translate(890.3,216.6) scale(0.7500)" fill="none" stroke="#bc4c00" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5h16v11H10l-4.5 4v-4H4z"/><path d="M8 8.5h8M8 11.5h5"/></g>
<text x="916.3" y="229.6" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#bc4c00">ADVISOR</text>
<text x="890.3" y="256.6" font-size="14" font-weight="700" fill="#1f2328">Ask the advisor</text>
<text x="890.3" y="274.6" font-size="12" fill="#59636e">A second AI, or you</text>
<rect x="774.5" y="67.3" width="40.4" height="20" rx="3" fill="#ffffff" stroke="#1a7f37" stroke-width="1"/>
<text x="794.7" y="81.1" text-anchor="middle" font-size="11" fill="#1a7f37">pass</text>
<rect x="546.5" y="169.6" width="40.4" height="20" rx="3" fill="#ffffff" stroke="#cf222e" stroke-width="1"/>
<text x="566.7" y="183.4" text-anchor="middle" font-size="11" fill="#cf222e">fail</text>
<rect x="727.0" y="237.6" width="99.8" height="20" rx="3" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<text x="776.9" y="251.4" text-anchor="middle" font-size="11" fill="#59636e">after 3 tries</text>
</svg>
