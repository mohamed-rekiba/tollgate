<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 -22 892 256" width="892" height="256" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">How one ticket is built</title>
<desc id="desc">The AI builds one attempt. If the locked tests pass, the change goes to the server, which runs the tests again. If not, the AI tries again with what went wrong. After 3 tries, or when stuck, it asks the advisor.</desc>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 L3.2,5 z" fill="#818b98"/></marker><marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 L3.2,5 z" fill="#cf222e"/></marker><marker id="arrow-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 L3.2,5 z" fill="#1a7f37"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#1f2328" flood-opacity="0.07"/></filter></defs>
<rect x="-21.5" y="-21.5" width="891" height="255" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
<path d="M202.0,40.0 L322.8,40.0" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<path d="M524.8,40.0 L645.6,40.0" fill="none" stroke="#1a7f37" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-pass)"/>
<path d="M423.8,80.0 L423.8,132.0" fill="none" stroke="#cf222e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-fail)"/>
<path d="M322.8,172.0 L113.0,172.0 Q101.0,172.0 101.0,160.0 L101.0,80.0" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<path d="M524.8,172.0 L645.6,172.0" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#arrow-plain)"/>
<rect x="0.0" y="0.0" width="202.0" height="80.0" rx="10" fill="#f9f6ff" stroke="#8250df" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
<clipPath id="clip0"><rect x="0.0" y="0.0" width="202.0" height="80.0" rx="10"/></clipPath>
<rect x="0.0" y="0.0" width="4" height="80.0" fill="#8250df" clip-path="url(#clip0)"/>
<text x="22.0" y="24.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#8250df">AI</text>
<text x="22.0" y="44.0" font-size="15" font-weight="600" fill="#1f2328">The AI builds</text>
<text x="22.0" y="63.0" font-size="13" fill="#59636e">One attempt</text>
<rect x="322.8" y="0.0" width="202.0" height="80.0" rx="10" fill="#fff9e5" stroke="#9a6700" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
<clipPath id="clip1"><rect x="322.8" y="0.0" width="202.0" height="80.0" rx="10"/></clipPath>
<rect x="322.8" y="0.0" width="4" height="80.0" fill="#9a6700" clip-path="url(#clip1)"/>
<text x="344.8" y="24.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#9a6700">CHECK</text>
<text x="344.8" y="44.0" font-size="15" font-weight="600" fill="#1f2328">Run the locked tests</text>
<text x="344.8" y="63.0" font-size="13" fill="#59636e">On the AI's own machine</text>
<rect x="645.6" y="0.0" width="202.0" height="80.0" rx="10" fill="#f2fbf4" stroke="#1a7f37" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
<clipPath id="clip2"><rect x="645.6" y="0.0" width="202.0" height="80.0" rx="10"/></clipPath>
<rect x="645.6" y="0.0" width="4" height="80.0" fill="#1a7f37" clip-path="url(#clip2)"/>
<text x="667.6" y="24.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#1a7f37">SERVER</text>
<text x="667.6" y="44.0" font-size="15" font-weight="600" fill="#1f2328">Send to the server</text>
<text x="667.6" y="63.0" font-size="13" fill="#59636e">It runs the tests again</text>
<rect x="322.8" y="132.0" width="202.0" height="80.0" rx="10" fill="#f9f6ff" stroke="#8250df" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
<clipPath id="clip3"><rect x="322.8" y="132.0" width="202.0" height="80.0" rx="10"/></clipPath>
<rect x="322.8" y="132.0" width="4" height="80.0" fill="#8250df" clip-path="url(#clip3)"/>
<text x="344.8" y="156.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#8250df">AI</text>
<text x="344.8" y="176.0" font-size="15" font-weight="600" fill="#1f2328">Try again</text>
<text x="344.8" y="195.0" font-size="13" fill="#59636e">With what went wrong</text>
<rect x="645.6" y="132.0" width="202.0" height="80.0" rx="10" fill="#fff5ee" stroke="#bc4c00" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
<clipPath id="clip4"><rect x="645.6" y="132.0" width="202.0" height="80.0" rx="10"/></clipPath>
<rect x="645.6" y="132.0" width="4" height="80.0" fill="#bc4c00" clip-path="url(#clip4)"/>
<text x="667.6" y="156.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#bc4c00">ADVISOR</text>
<text x="667.6" y="176.0" font-size="15" font-weight="600" fill="#1f2328">Ask the advisor</text>
<text x="667.6" y="195.0" font-size="13" fill="#59636e">A second AI, or you</text>
<rect x="564.0" y="29.0" width="42.4" height="22" rx="11.0" fill="#ffffff" stroke="#1a7f37" stroke-width="1"/>
<text x="585.2" y="44.2" text-anchor="middle" font-size="12" font-weight="500" fill="#1a7f37">pass</text>
<rect x="405.6" y="95.0" width="36.4" height="22" rx="11.0" fill="#ffffff" stroke="#cf222e" stroke-width="1"/>
<text x="423.8" y="110.2" text-anchor="middle" font-size="12" font-weight="500" fill="#cf222e">fail</text>
<rect x="538.8" y="161.0" width="92.8" height="22" rx="11.0" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<text x="585.2" y="176.2" text-anchor="middle" font-size="12" font-weight="500" fill="#59636e">after 3 tries</text>
</svg>
