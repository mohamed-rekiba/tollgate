<path d="M332.8,-4.0 H319.8 V9.0" fill="none" stroke="#d29922" stroke-width="1.2"/>
<path d="M510.8,90.0 H523.8 V77.0" fill="none" stroke="#d29922" stroke-width="1.2"/>
<g transform="translate(337.8,12.0) scale(0.7500)" fill="none" stroke="#d29922" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6.5l-5.2 8.7A1.9 1.9 0 0 0 6.4 21h11.2a1.9 1.9 0 0 0 1.6-2.8L14 9.5V3"/><path d="M7.4 15h9.2"/></g>
