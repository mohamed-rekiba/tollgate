<text x="337.8" y="52.0" font-size="14" font-weight="700" fill="#f0f6fc">Run the locked tests</text>
<text x="337.8" y="70.0" font-size="12" fill="#9198a1">On the AI's own machine</text>
<rect x="647.6" y="0.0" width="196.0" height="86.0" rx="4" fill="#0c2114" stroke="#3fb950" stroke-opacity="0.7" stroke-width="1.2"/>
<path d="M656.6,-4.0 H643.6 V9.0" fill="none" stroke="#3fb950" stroke-width="1.2"/>
<path d="M834.6,90.0 H847.6 V77.0" fill="none" stroke="#3fb950" stroke-width="1.2"/>
<g transform="translate(661.6,12.0) scale(0.7500)" fill="none" stroke="#3fb950" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4a2 2 0 1 0 0 4a2 2 0 1 0 0-4z"/><path d="M6 16a2 2 0 1 0 0 4a2 2 0 1 0 0-4z"/><path d="M18 16a2 2 0 1 0 0 4a2 2 0 1 0 0-4z"/><path d="M6 8v8"/><path d="M18 16v-6a3 3 0 0 0-3-3h-4"/><path d="M13 4.5L10.5 7L13 9.5"/></g>
<text x="687.6" y="25.0" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#3fb950">SERVER</text>
<text x="661.6" y="52.0" font-size="14" font-weight="700" fill="#f0f6fc">Send to the server</text>
<text x="661.6" y="70.0" font-size="12" fill="#9198a1">It runs the tests again</text>
<rect x="323.8" y="136.0" width="196.0" height="86.0" rx="4" fill="#1b1430" stroke="#ab7df8" stroke-opacity="0.7" stroke-width="1.2"/>
