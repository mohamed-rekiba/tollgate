<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 1043 288" width="1043" height="288" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
<title id="title">How one ticket is built</title>
<desc id="desc">The AI builds one attempt. If the locked tests pass, the change goes to the server, which runs the tests again. If not, it tries again with what went wrong. After 3 tries, or when stuck, it asks the advisor.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect x="-12" y="-12" width="1043" height="288" fill="#0d1117"/>
<line x1="148.2" y1="69.8" x2="358.9" y2="69.8" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="526.6" y1="69.8" x2="737.4" y2="69.8" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="616.8" y="58.8" width="30.4" height="20" rx="4" fill="#0d1117"/>
<text x="632.0" y="73.8" text-anchor="middle" font-size="13" fill="#e6edf3">yes</text>
<line x1="442.8" y1="115.5" x2="442.8" y2="179.5" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="431.0" y="136.5" width="23.6" height="20" rx="4" fill="#0d1117"/>
<text x="442.8" y="151.5" text-anchor="middle" font-size="13" fill="#e6edf3">no</text>
<line x1="365.2" y1="179.5" x2="148.2" y2="94.2" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="530.8" y1="210.0" x2="796.6" y2="210.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="580.4" y="199.0" width="166.6" height="20" rx="4" fill="#0d1117"/>
<text x="663.7" y="214.0" text-anchor="middle" font-size="13" fill="#e6edf3">after 3 tries, or stuck</text>
<rect x="24.0" y="39.2" width="124.2" height="61.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="86.1" y="64.9" text-anchor="middle" fill="#e6edf3" font-weight="600">The AI builds</text>
<text x="86.1" y="83.9" text-anchor="middle" fill="#e6edf3">one attempt</text>
<polygon points="442.8,24.0 526.6,69.8 442.8,115.5 358.9,69.8" fill="#3b2e00" stroke="#8b949e" stroke-width="1.4"/>
<text x="442.8" y="64.9" text-anchor="middle" fill="#e6edf3" font-weight="600">Do the locked</text>
<text x="442.8" y="83.9" text-anchor="middle" fill="#e6edf3">tests pass?</text>
<rect x="737.4" y="39.2" width="257.4" height="61.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="866.1" y="64.9" text-anchor="middle" fill="#e6edf3" font-weight="600">The change goes to the server</text>
<text x="866.1" y="83.9" text-anchor="middle" fill="#e6edf3">The server runs the tests again</text>
<rect x="354.8" y="179.5" width="176.0" height="61.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="442.8" y="205.2" text-anchor="middle" fill="#e6edf3" font-weight="600">Try again</text>
<text x="442.8" y="224.2" text-anchor="middle" fill="#e6edf3">with what went wrong</text>
<rect x="796.6" y="189.0" width="139.0" height="42.0" rx="8" fill="#0c2d6b" stroke="#8b949e" stroke-width="1.4"/>
<text x="866.1" y="214.7" text-anchor="middle" fill="#e6edf3">Ask the advisor</text>
</svg>
