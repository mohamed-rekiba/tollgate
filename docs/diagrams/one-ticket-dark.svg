<text x="363.8" y="161.0" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#ab7df8">AI</text>
<text x="337.8" y="188.0" font-size="14" font-weight="700" fill="#f0f6fc">Try again</text>
<text x="337.8" y="206.0" font-size="12" fill="#9198a1">With what went wrong</text>
<rect x="647.6" y="136.0" width="196.0" height="86.0" rx="4" fill="#271608" stroke="#f0883e" stroke-opacity="0.7" stroke-width="1.2"/>
<path d="M656.6,132.0 H643.6 V145.0" fill="none" stroke="#f0883e" stroke-width="1.2"/>
<path d="M834.6,226.0 H847.6 V213.0" fill="none" stroke="#f0883e" stroke-width="1.2"/>
<g transform="translate(661.6,148.0) scale(0.7500)" fill="none" stroke="#f0883e" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5h16v11H10l-4.5 4v-4H4z"/><path d="M8 8.5h8M8 11.5h5"/></g>
<text x="687.6" y="161.0" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#f0883e">ADVISOR</text>
<text x="661.6" y="188.0" font-size="14" font-weight="700" fill="#f0f6fc">Ask the advisor</text>
<text x="661.6" y="206.0" font-size="12" fill="#9198a1">A second AI, or you</text>
<rect x="563.5" y="33.0" width="40.4" height="20" rx="3" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
<text x="583.7" y="46.8" text-anchor="middle" font-size="11" fill="#3fb950">pass</text>
<rect x="401.6" y="101.0" width="40.4" height="20" rx="3" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
<text x="421.8" y="114.8" text-anchor="middle" font-size="11" fill="#f85149">fail</text>
<rect x="533.8" y="169.0" width="99.8" height="20" rx="3" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
<text x="583.7" y="182.8" text-anchor="middle" font-size="11" fill="#9198a1">after 3 tries</text>
</svg>
