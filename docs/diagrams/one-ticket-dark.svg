<text x="663.8" y="78.8" text-anchor="middle" font-size="14" font-weight="700" fill="#f0f6fc">Score 70%</text>
<text x="663.8" y="96.8" text-anchor="middle" font-size="12" fill="#9198a1">or more?</text>
<text x="663.8" y="113.8" text-anchor="middle" font-size="12" fill="#9198a1">Reviewers check</text>
