<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 892 270" width="892" height="270" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title id="title">How one ticket is built</title>
<desc id="desc">The AI builds one attempt and runs the locked tests on its own machine. On a pass, the change goes to the server, which runs the tests again. On a fail, the AI tries again with what went wrong. After 3 tries, or when stuck, it asks the advisor.</desc>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 L3.2,5 z" fill="#656c76"/></marker><marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 L3.2,5 z" fill="#f85149"/></marker><marker id="arrow-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 L3.2,5 z" fill="#3fb950"/></marker><pattern id="grid" x="-24" y="-24" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#161b22" stroke-width="1"/></pattern></defs>
<style>.main{stroke-width:2.6;stroke-dasharray:0 7;animation:flow 0.8s linear infinite}.side{stroke-width:1.6;stroke-dasharray:6 5;animation:side 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-7}}@keyframes side{to{stroke-dashoffset:-11}}@media (prefers-reduced-motion:reduce){.main,.side{animation:none}.ticket{display:none}}</style>
<rect x="-24" y="-24" width="892" height="270" fill="#0d1117"/>
<rect x="-24" y="-24" width="892" height="270" fill="url(#grid)"/>
<path class="main" d="M196.0,43.0 L323.8,43.0" fill="none" stroke="#656c76" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<path class="main" d="M519.8,43.0 L647.6,43.0" fill="none" stroke="#3fb950" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-pass)"/>
<path class="main" d="M421.8,86.0 L421.8,136.0" fill="none" stroke="#f85149" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-fail)"/>
<path class="main" d="M323.8,179.0 L110.0,179.0 Q98.0,179.0 98.0,167.0 L98.0,86.0" fill="none" stroke="#656c76" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<path class="side" d="M519.8,179.0 L647.6,179.0" fill="none" stroke="#656c76" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<rect x="0.0" y="0.0" width="196.0" height="86.0" rx="4" fill="#1b1430" stroke="#ab7df8" stroke-opacity="0.7" stroke-width="1.2"/>
<path d="M9.0,-4.0 H-4.0 V9.0" fill="none" stroke="#ab7df8" stroke-width="1.2"/>
<path d="M187.0,90.0 H200.0 V77.0" fill="none" stroke="#ab7df8" stroke-width="1.2"/>
<g transform="translate(14.0,12.0) scale(0.7500)" fill="none" stroke="#ab7df8" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.5l1.9 5.1L18 10.5l-5.1 1.9L11 17.5l-1.9-5.1L4 10.5l5.1-1.9z"/><path d="M18.5 15l.8 2.2l2.2.8l-2.2.8l-.8 2.2l-.8-2.2l-2.2-.8l2.2-.8z"/></g>
<text x="40.0" y="25.0" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#ab7df8">AI</text>
<text x="14.0" y="52.0" font-size="14" font-weight="700" fill="#f0f6fc">The AI builds</text>
<text x="14.0" y="70.0" font-size="12" fill="#9198a1">One attempt</text>
