<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 -22 892 256" width="892" height="256" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">How one ticket is built</title>
<desc id="desc">The AI builds one attempt. If the locked tests pass, the change goes to the server, which runs the tests again. If not, the AI tries again with what went wrong. After 3 tries, or when stuck, it asks the advisor.</desc>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 L3.2,5 z" fill="#656c76"/></marker><marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 L3.2,5 z" fill="#f85149"/></marker><marker id="arrow-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 L3.2,5 z" fill="#3fb950"/></marker></defs>
<style>.main{stroke-width:3;stroke-dasharray:0 8;animation:flow 0.8s linear infinite}.side{stroke-width:1.8;stroke-dasharray:6 6;animation:side 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-8}}@keyframes side{to{stroke-dashoffset:-12}}@media (prefers-reduced-motion:reduce){.main,.side{animation:none}.ticket{display:none}}</style>
<rect x="-22" y="-22" width="892" height="256" fill="#0d1117"/>
<path class="main" d="M202.0,40.0 L322.8,40.0" fill="none" stroke="#656c76" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<path class="main" d="M524.8,40.0 L645.6,40.0" fill="none" stroke="#3fb950" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-pass)"/>
<path class="main" d="M423.8,80.0 L423.8,132.0" fill="none" stroke="#f85149" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-fail)"/>
<path class="main" d="M322.8,172.0 L113.0,172.0 Q101.0,172.0 101.0,160.0 L101.0,80.0" fill="none" stroke="#656c76" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<path class="side" d="M524.8,172.0 L645.6,172.0" fill="none" stroke="#656c76" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<rect x="0.0" y="0.0" width="202.0" height="80.0" rx="10" fill="#1b1430" stroke="#ab7df8" stroke-opacity="0.55" stroke-width="1"/>
<clipPath id="clip0"><rect x="0.0" y="0.0" width="202.0" height="80.0" rx="10"/></clipPath>
<rect x="0.0" y="0.0" width="4" height="80.0" fill="#ab7df8" clip-path="url(#clip0)"/>
<text x="22.0" y="24.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#ab7df8">AI</text>
<text x="22.0" y="44.0" font-size="15" font-weight="600" fill="#f0f6fc">The AI builds</text>
<text x="22.0" y="63.0" font-size="13" fill="#9198a1">One attempt</text>
<rect x="322.8" y="0.0" width="202.0" height="80.0" rx="10" fill="#221a08" stroke="#d29922" stroke-opacity="0.55" stroke-width="1"/>
<clipPath id="clip1"><rect x="322.8" y="0.0" width="202.0" height="80.0" rx="10"/></clipPath>
<rect x="322.8" y="0.0" width="4" height="80.0" fill="#d29922" clip-path="url(#clip1)"/>
<text x="344.8" y="24.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#d29922">CHECK</text>
<text x="344.8" y="44.0" font-size="15" font-weight="600" fill="#f0f6fc">Run the locked tests</text>
<text x="344.8" y="63.0" font-size="13" fill="#9198a1">On the AI's own machine</text>
<rect x="645.6" y="0.0" width="202.0" height="80.0" rx="10" fill="#0c2114" stroke="#3fb950" stroke-opacity="0.55" stroke-width="1"/>
<clipPath id="clip2"><rect x="645.6" y="0.0" width="202.0" height="80.0" rx="10"/></clipPath>
<rect x="645.6" y="0.0" width="4" height="80.0" fill="#3fb950" clip-path="url(#clip2)"/>
<text x="667.6" y="24.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#3fb950">SERVER</text>
<text x="667.6" y="44.0" font-size="15" font-weight="600" fill="#f0f6fc">Send to the server</text>
<text x="667.6" y="63.0" font-size="13" fill="#9198a1">It runs the tests again</text>
<rect x="322.8" y="132.0" width="202.0" height="80.0" rx="10" fill="#1b1430" stroke="#ab7df8" stroke-opacity="0.55" stroke-width="1"/>
<clipPath id="clip3"><rect x="322.8" y="132.0" width="202.0" height="80.0" rx="10"/></clipPath>
<rect x="322.8" y="132.0" width="4" height="80.0" fill="#ab7df8" clip-path="url(#clip3)"/>
<text x="344.8" y="156.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#ab7df8">AI</text>
<text x="344.8" y="176.0" font-size="15" font-weight="600" fill="#f0f6fc">Try again</text>
<text x="344.8" y="195.0" font-size="13" fill="#9198a1">With what went wrong</text>
<rect x="645.6" y="132.0" width="202.0" height="80.0" rx="10" fill="#271608" stroke="#f0883e" stroke-opacity="0.55" stroke-width="1"/>
<clipPath id="clip4"><rect x="645.6" y="132.0" width="202.0" height="80.0" rx="10"/></clipPath>
<rect x="645.6" y="132.0" width="4" height="80.0" fill="#f0883e" clip-path="url(#clip4)"/>
<text x="667.6" y="156.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#f0883e">ADVISOR</text>
<text x="667.6" y="176.0" font-size="15" font-weight="600" fill="#f0f6fc">Ask the advisor</text>
<text x="667.6" y="195.0" font-size="13" fill="#9198a1">A second AI, or you</text>
<rect x="564.0" y="29.0" width="42.4" height="22" rx="11.0" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
<text x="585.2" y="44.2" text-anchor="middle" font-size="12" font-weight="500" fill="#3fb950">pass</text>
<rect x="405.6" y="95.0" width="36.4" height="22" rx="11.0" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
<text x="423.8" y="110.2" text-anchor="middle" font-size="12" font-weight="500" fill="#f85149">fail</text>
<rect x="538.8" y="161.0" width="92.8" height="22" rx="11.0" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
<text x="585.2" y="176.2" text-anchor="middle" font-size="12" font-weight="500" fill="#9198a1">after 3 tries</text>
</svg>
