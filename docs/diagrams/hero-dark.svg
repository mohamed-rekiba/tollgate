<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title id="title">Tollgate: AI writes the code, locked tests decide</title>
<desc id="desc">A banner. On the left: Tollgate, governed builds for Claude Code. AI writes the code; locked tests decide. Tests are written first and locked on GitHub, out of the AI's reach, and only a pass goes in. On the right, an isometric drawing: a change leaves the AI's room and stops at the gate while the locked tests run. They fail, and it goes back to the room on a red path. It comes again, the tests pass, the barrier lifts, and it goes into the main branch.</desc>
