<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 890 209" width="890" height="209" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
<title id="title">The AI's room and the server</title>
<desc id="desc">The AI writes code and runs tests in its own room, with no key to the server. The server locks the tests and runs them on every change. Tollgate carries the change to the server, and the server answers pass or fail.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect x="-12" y="-12" width="890" height="209" fill="#0d1117"/>
<line x1="333.2" y1="73.5" x2="451.3" y2="73.5" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="353.2" y="62.5" width="78.1" height="20" rx="4" fill="#0d1117"/>
<text x="392.2" y="77.5" text-anchor="middle" font-size="13" fill="#e6edf3">the change</text>
<path d="M646.6,123.0 Q412.6,223.2 178.6,123.0" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="366.7" y="162.1" width="91.7" height="20" rx="4" fill="#0d1117"/>
<text x="412.6" y="177.1" text-anchor="middle" font-size="13" fill="#e6edf3">pass or fail</text>
<rect x="24.0" y="24.0" width="309.2" height="99.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="178.6" y="49.7" text-anchor="middle" fill="#e6edf3" font-weight="600">The AI's room</text>
<text x="178.6" y="68.7" text-anchor="middle" fill="#e6edf3">The AI writes code and runs the tests.</text>
<text x="178.6" y="87.7" text-anchor="middle" fill="#e6edf3">It has no key to the server.</text>
<text x="178.6" y="106.7" text-anchor="middle" fill="#e6edf3">It cannot touch the locks.</text>
<rect x="451.3" y="24.0" width="390.6" height="99.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="646.6" y="49.7" text-anchor="middle" fill="#e6edf3" font-weight="600">The server</text>
<text x="646.6" y="68.7" text-anchor="middle" fill="#e6edf3">It locks the tests and runs them on every change.</text>
<text x="646.6" y="87.7" text-anchor="middle" fill="#e6edf3">Nobody can change a lock.</text>
<text x="646.6" y="106.7" text-anchor="middle" fill="#e6edf3">Only a pass lets a change in.</text>
</svg>
