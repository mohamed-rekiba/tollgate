<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -62 1168 725" width="1168" height="725" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title id="title">Who does what with Tollgate</title>
<desc id="desc">You give a task, merge a ready change, and approve a change of tier 3 or 4, which extends the merge. The advisor answers questions. The builder builds a ticket, which always includes passing the gate; the reviewer reviews a try; the test writer writes the locked tests.</desc>
