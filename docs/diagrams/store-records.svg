<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 868 794" width="868" height="794" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title id="title">The signed records the store keeps, and the keys that link them</title>
<desc id="desc">The store keeps signed records as files in the state folder, not in a database. A plan lock lists the tickets of a task; each ticket has a lock of its tests, and at most one older lock it replaced. A pass record names its ticket and the fingerprint of the lock, and the commit it started from, which has its own pass record unless it is main. A ready change and an owner's approval name the commit of a pass.</desc>
