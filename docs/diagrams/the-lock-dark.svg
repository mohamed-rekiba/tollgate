<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 912 151" width="912" height="151" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title id="title">The idea of Tollgate in four steps</title>
<desc id="desc">First the tests are written; they say what done means. Then they are locked on the server, out of the AI's reach. The AI builds, and may try again, but cannot move the goal. The locked tests decide, and only a pass goes in.</desc>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 L3.2,5 z" fill="#656c76"/></marker><marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 L3.2,5 z" fill="#f85149"/></marker><marker id="arrow-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 L3.2,5 z" fill="#3fb950"/></marker><pattern id="grid" x="-24" y="-24" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#161b22" stroke-width="1"/></pattern></defs>
<style>.main{stroke-width:2.6;stroke-dasharray:0 7;animation:flow 0.8s linear infinite}.side{stroke-width:1.6;stroke-dasharray:6 5;animation:side 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-7}}@keyframes side{to{stroke-dashoffset:-11}}@media (prefers-reduced-motion:reduce){.main,.side{animation:none}.ticket{display:none}}</style>
<rect x="-24" y="-24" width="912" height="151" fill="#0d1117"/>
<rect x="-24" y="-24" width="912" height="151" fill="url(#grid)"/>
<path class="main" d="M180.0,51.5 L228.0,51.5" fill="none" stroke="#656c76" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<path class="main" d="M408.0,51.5 L456.0,51.5" fill="none" stroke="#656c76" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<path class="main" d="M636.0,51.5 L684.0,51.5" fill="none" stroke="#656c76" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<rect x="0.0" y="0.0" width="180.0" height="103.0" rx="4" fill="#1b1430" stroke="#ab7df8" stroke-opacity="0.7" stroke-width="1.2"/>
<path d="M9.0,-4.0 H-4.0 V9.0" fill="none" stroke="#ab7df8" stroke-width="1.2"/>
<path d="M171.0,107.0 H184.0 V94.0" fill="none" stroke="#ab7df8" stroke-width="1.2"/>
<g transform="translate(14.0,12.0) scale(0.7500)" fill="none" stroke="#ab7df8" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6.5l-5.2 8.7A1.9 1.9 0 0 0 6.4 21h11.2a1.9 1.9 0 0 0 1.6-2.8L14 9.5V3"/><path d="M7.4 15h9.2"/></g>
<text x="40.0" y="25.0" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#ab7df8">STEP 1 · AI</text>
<text x="14.0" y="52.0" font-size="14" font-weight="700" fill="#f0f6fc">Write the tests</text>
<text x="14.0" y="70.0" font-size="12" fill="#9198a1">They say what</text>
<text x="14.0" y="87.0" font-size="12" fill="#9198a1">done means</text>
<rect x="228.0" y="0.0" width="180.0" height="103.0" rx="4" fill="#0c2114" stroke="#3fb950" stroke-opacity="0.7" stroke-width="1.2"/>
<path d="M237.0,-4.0 H224.0 V9.0" fill="none" stroke="#3fb950" stroke-width="1.2"/>
<path d="M399.0,107.0 H412.0 V94.0" fill="none" stroke="#3fb950" stroke-width="1.2"/>
<g transform="translate(242.0,12.0) scale(0.7500)" fill="none" stroke="#3fb950" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1z"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><path d="M12 15v2.5"/></g>
<text x="268.0" y="25.0" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#3fb950">STEP 2 · SERVER</text>
<text x="242.0" y="52.0" font-size="14" font-weight="700" fill="#f0f6fc">Lock them</text>
<text x="242.0" y="70.0" font-size="12" fill="#9198a1">On the server, out</text>
<text x="242.0" y="87.0" font-size="12" fill="#9198a1">of the AI's reach</text>
<rect x="456.0" y="0.0" width="180.0" height="103.0" rx="4" fill="#1b1430" stroke="#ab7df8" stroke-opacity="0.7" stroke-width="1.2"/>
<path d="M465.0,-4.0 H452.0 V9.0" fill="none" stroke="#ab7df8" stroke-width="1.2"/>
<path d="M627.0,107.0 H640.0 V94.0" fill="none" stroke="#ab7df8" stroke-width="1.2"/>
<g transform="translate(470.0,12.0) scale(0.7500)" fill="none" stroke="#ab7df8" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.5l1.9 5.1L18 10.5l-5.1 1.9L11 17.5l-1.9-5.1L4 10.5l5.1-1.9z"/><path d="M18.5 15l.8 2.2l2.2.8l-2.2.8l-.8 2.2l-.8-2.2l-2.2-.8l2.2-.8z"/></g>
<text x="496.0" y="25.0" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#ab7df8">STEP 3 · AI</text>
<text x="470.0" y="52.0" font-size="14" font-weight="700" fill="#f0f6fc">The AI builds</text>
<text x="470.0" y="70.0" font-size="12" fill="#9198a1">It may try again.</text>
<text x="470.0" y="87.0" font-size="12" fill="#9198a1">The goal stays put.</text>
<rect x="684.0" y="0.0" width="180.0" height="103.0" rx="4" fill="#221a08" stroke="#d29922" stroke-opacity="0.7" stroke-width="1.2"/>
<path d="M693.0,-4.0 H680.0 V9.0" fill="none" stroke="#d29922" stroke-width="1.2"/>
<path d="M855.0,107.0 H868.0 V94.0" fill="none" stroke="#d29922" stroke-width="1.2"/>
<g transform="translate(698.0,12.0) scale(0.7500)" fill="none" stroke="#d29922" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8h3v12.5h-3z"/><path d="M6.5 10h14v3h-14z"/><path d="M10 10l-2 3M14 10l-2 3M18 10l-2 3"/><path d="M2 20.5h20"/></g>
<text x="724.0" y="25.0" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#d29922">STEP 4 · CHECK</text>
<text x="698.0" y="52.0" font-size="14" font-weight="700" fill="#f0f6fc">The tests decide</text>
<text x="698.0" y="70.0" font-size="12" fill="#9198a1">Only a pass</text>
<text x="698.0" y="87.0" font-size="12" fill="#9198a1">goes in</text>
</svg>
