<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 1075 152" width="1075" height="152" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
<title id="title">The idea of Tollgate in four steps</title>
<desc id="desc">Tests are written first and say what done means. They are locked on the server, where the AI cannot reach. The AI builds and may try again, but cannot move the goal. The tests decide, and only a pass lets the change in.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect x="-12" y="-12" width="1075" height="152" fill="#0d1117"/>
<line x1="229.6" y1="64.0" x2="299.6" y2="64.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="475.6" y1="64.0" x2="545.6" y2="64.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="751.2" y1="64.0" x2="821.2" y2="64.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="24.0" y="33.5" width="205.6" height="61.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="126.8" y="59.2" text-anchor="middle" fill="#e6edf3" font-weight="600">1. Write the tests</text>
<text x="126.8" y="78.2" text-anchor="middle" fill="#e6edf3">They say what done means</text>
<rect x="299.6" y="24.0" width="176.0" height="80.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="387.6" y="49.7" text-anchor="middle" fill="#e6edf3" font-weight="600">2. Lock them</text>
<text x="387.6" y="68.7" text-anchor="middle" fill="#e6edf3">On the server, where</text>
<text x="387.6" y="87.7" text-anchor="middle" fill="#e6edf3">the AI cannot reach</text>
<rect x="545.6" y="24.0" width="205.6" height="80.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="648.4" y="49.7" text-anchor="middle" fill="#e6edf3" font-weight="600">3. The AI builds</text>
<text x="648.4" y="68.7" text-anchor="middle" fill="#e6edf3">It can try again.</text>
<text x="648.4" y="87.7" text-anchor="middle" fill="#e6edf3">It cannot move the goal.</text>
<rect x="821.2" y="33.5" width="205.6" height="61.0" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/>
<text x="924.0" y="59.2" text-anchor="middle" fill="#e6edf3" font-weight="600">4. The tests decide</text>
<text x="924.0" y="78.2" text-anchor="middle" fill="#e6edf3">Pass: the change goes in</text>
</svg>
