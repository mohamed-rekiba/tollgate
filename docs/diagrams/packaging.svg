<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 679 171" width="679" height="171" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
<title id="title">Where each part runs</title>
<desc id="desc">On your machine runs the plugin: the skills you type in Claude Code, the driver that runs the steps, and the instructions for each AI role. On the server runs the workflow: the freeze that locks the tests, and the gate that runs them.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="-12" y="-12" width="679" height="171" fill="#ffffff"/>
<rect x="24.0" y="24.0" width="279.6" height="99.0" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.4"/>
<text x="163.8" y="49.7" text-anchor="middle" fill="#1f2328" font-weight="600">On your machine: the plugin</text>
<text x="163.8" y="68.7" text-anchor="middle" fill="#1f2328">The skills you type in Claude Code</text>
<text x="163.8" y="87.7" text-anchor="middle" fill="#1f2328">The driver that runs the steps</text>
<text x="163.8" y="106.7" text-anchor="middle" fill="#1f2328">The instructions for each AI role</text>
<rect x="373.6" y="33.5" width="257.4" height="80.0" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.4"/>
<text x="502.3" y="59.2" text-anchor="middle" fill="#1f2328" font-weight="600">On the server: the workflow</text>
<text x="502.3" y="78.2" text-anchor="middle" fill="#1f2328">The freeze that locks the tests</text>
<text x="502.3" y="97.2" text-anchor="middle" fill="#1f2328">The gate that runs them</text>
</svg>
