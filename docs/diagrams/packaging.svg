<rect x="0.0" y="0.0" width="250.0" height="116.0" rx="10" fill="#f3f8ff" stroke="#0969da" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
<clipPath id="clip0"><rect x="0.0" y="0.0" width="250.0" height="116.0" rx="10"/></clipPath>
<rect x="0.0" y="0.0" width="4" height="116.0" fill="#0969da" clip-path="url(#clip0)"/>
<text x="22.0" y="24.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#0969da">YOUR MACHINE</text>
<text x="22.0" y="44.0" font-size="15" font-weight="600" fill="#1f2328">The plugin</text>
<text x="22.0" y="63.0" font-size="13" fill="#59636e">The skills you type in Claude Code</text>
<text x="22.0" y="81.0" font-size="13" fill="#59636e">The driver that runs the steps</text>
<text x="22.0" y="99.0" font-size="13" fill="#59636e">The instructions for each AI role</text>
<rect x="333.6" y="0.0" width="249.9" height="116.0" rx="10" fill="#f2fbf4" stroke="#1a7f37" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
<clipPath id="clip1"><rect x="333.6" y="0.0" width="249.9" height="116.0" rx="10"/></clipPath>
<rect x="333.6" y="0.0" width="4" height="116.0" fill="#1a7f37" clip-path="url(#clip1)"/>
<text x="355.6" y="24.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#1a7f37">THE SERVER</text>
