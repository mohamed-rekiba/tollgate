<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 895 881" width="895" height="881" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title id="title">The plan and its tickets, and the records that lock them</title>
<desc id="desc">A plan lists one or more tickets, and each ticket owns 3 to 10 checklist items. The store signs a plan lock that fingerprints the plan, and up to two locks for each ticket's tests. A pass record from the gate names the fingerprint of the ticket's lock, and an owner's approval of the same commit lets a tier 3 or 4 change merge.</desc>
