<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 -22 771 124" width="771" height="124" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">A large request in three parts</title>
<desc id="desc">First the base: the project can be built, tested, and run. Then the skeleton: the shared rules and one thin path that works. Then the features, one at a time, each proven from end to end.</desc>
