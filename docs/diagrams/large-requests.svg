<rect x="258.3" y="0.0" width="4" height="80.0" fill="#59636e" clip-path="url(#clip1)"/>
<text x="280.3" y="24.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#59636e">PART 2</text>
<text x="280.3" y="44.0" font-size="15" font-weight="600" fill="#1f2328">The skeleton</text>
<text x="280.3" y="63.0" font-size="13" fill="#59636e">Shared rules, one thin path</text>
