<rect x="-22" y="-22" width="771" height="124" fill="#ffffff"/>
<path d="M210.3,40.0 L258.3,40.0" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<path d="M468.6,40.0 L516.6,40.0" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-plain)"/>
<rect x="0.0" y="0.0" width="210.3" height="80.0" rx="10" fill="#f6f8fa" stroke="#59636e" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
<clipPath id="clip0"><rect x="0.0" y="0.0" width="210.3" height="80.0" rx="10"/></clipPath>
<rect x="0.0" y="0.0" width="4" height="80.0" fill="#59636e" clip-path="url(#clip0)"/>
<text x="22.0" y="24.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#59636e">PART 1</text>
<text x="22.0" y="44.0" font-size="15" font-weight="600" fill="#1f2328">The base</text>
