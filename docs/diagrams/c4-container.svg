<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -54 1117 952" width="1117" height="952" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title id="title">Container diagram for Tollgate</title>
<desc id="desc">Inside Tollgate: your Claude Code session asks the driver for each step and runs the hooks before each tool call. The driver runs the gate after each try and reaches the state folder only through the store. The store locks tests, writes records, and merges a ready change into your project.</desc>
