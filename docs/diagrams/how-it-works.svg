<text x="22.0" y="572.0" font-size="15" font-weight="600" fill="#1f2328">The AI builds</text>
<text x="22.0" y="591.0" font-size="13" fill="#59636e">Until the locked tests pass</text>
<rect x="0.0" y="660.0" width="256.5" height="80.0" rx="10" fill="#fff9e5" stroke="#9a6700" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
