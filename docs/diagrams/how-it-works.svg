<text x="22.0" y="855.0" font-size="13" fill="#59636e">Only a pass goes in</text>
<rect x="0.0" y="924.0" width="256.5" height="80.0" rx="10" fill="#f9f6ff" stroke="#8250df" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
