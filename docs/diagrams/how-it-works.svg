<text x="22.0" y="684.0" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#9a6700">CHECK</text>
<text x="22.0" y="704.0" font-size="15" font-weight="600" fill="#1f2328">The gate runs the tests</text>
<text x="22.0" y="723.0" font-size="13" fill="#59636e">And the reviewers read the change</text>
<rect x="0.0" y="792.0" width="256.5" height="80.0" rx="10" fill="#f2fbf4" stroke="#1a7f37" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
