<text x="22.0" y="440.0" font-size="15" font-weight="600" fill="#1f2328">Tests are locked</text>
<text x="22.0" y="459.0" font-size="13" fill="#59636e">On the server, before the build</text>
<rect x="0.0" y="528.0" width="256.5" height="80.0" rx="10" fill="#f9f6ff" stroke="#8250df" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
<clipPath id="clip4"><rect x="0.0" y="528.0" width="256.5" height="80.0" rx="10"/></clipPath>
<rect x="0.0" y="528.0" width="4" height="80.0" fill="#8250df" clip-path="url(#clip4)"/>
