<svg xmlns="http://www.w3.org/2000/svg" viewBox="-162 -12 724 955" width="724" height="955" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
<title id="title">How Tollgate works, with its three feedback loops</title>
<desc id="desc">A request becomes a plan, which reviewers check until they find no problems. Tests are written and locked, then the AI builds. When the gate or reviewers find a problem, what failed goes back to the builder. When it is stuck, the advisor decides. After a merge, the retro turns lessons into stricter rules for the next plan.</desc>
