<text x="22.0" y="968.0" font-size="15" font-weight="600" fill="#1f2328">The retro</text>
<text x="22.0" y="987.0" font-size="13" fill="#59636e">Numbers and up to 3 lessons</text>
<rect x="333.5" y="660.0" width="256.5" height="80.0" rx="10" fill="#fff5ee" stroke="#bc4c00" stroke-opacity="0.55" stroke-width="1" filter="url(#shadow)"/>
