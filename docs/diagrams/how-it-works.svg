<svg xmlns="http://www.w3.org/2000/svg" viewBox="-361 -22 973 1048" width="973" height="1048" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">How Tollgate works, with its three feedback loops</title>
<desc id="desc">You ask in plain words. The AI writes a plan, and fresh AIs check it until they find no problems. Tests are written and locked on the server, then the AI builds. When the gate fails, what failed goes back to the builder. When the builder is stuck, the advisor decides. After a merge, the retro turns lessons into stricter rules for the next plan.</desc>
