name: A request
description: Something Tollgate should do that it does not do now.
labels: [request]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: The problem, in your words. Leave the solution out for now.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: How you work around it now, if you do.
