name: Something is wrong
description: Tollgate did something it should not, or did not do what the docs say.
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you ran, and what Tollgate did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened, and the doc or rule that says so, if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The smallest steps that show it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tollgate version
      description: From .claude-plugin/plugin.json, such as 0.1.0.
    validations:
      required: true
  - type: dropdown
    id: isolation
    attributes:
      label: Isolation
      options: [container, sandbox, "not sure"]
