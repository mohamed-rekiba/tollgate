name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Style
        run: pipx run ruff check .
      - name: Tests
        run: |
          pip install pyyaml
          python -m unittest discover -s tests -t . -v
      - name: Stage 2 proof
        run: python -m unittest tests.proof_stage2 -v
      - name: Stage 3 proof
        run: python -m unittest tests.proof_stage3 -v
      - name: Stage 4 proof
        run: python -m unittest tests.proof_stage4 -v
      - name: Workflow templates
        run: |
          pip install actionlint-py shellcheck-py
          tests/lint_workflows.sh
