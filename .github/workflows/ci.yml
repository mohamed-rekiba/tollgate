name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the check tools
        run: pip install -r requirements-dev.txt
      - name: Style
        run: ruff check .
      - name: Writing
        # The check compares the branch with main, so a pull request needs a main branch.
        run: |
          git rev-parse --verify --quiet refs/heads/main >/dev/null || git branch main origin/main
          python3 setup/check_writing.py
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
