name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the check tools
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Style
        run: ruff check .
      - name: Writing
        # The check compares the branch with main, so a pull request needs a main branch.
        run: |
          git rev-parse --verify --quiet refs/heads/main >/dev/null || git branch main origin/main
          python3 setup/check_writing.py
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
