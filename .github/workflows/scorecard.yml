# OpenSSF Scorecard checks how this repository keeps its supply chain safe: pinned
# actions, branch rules, token permissions, and more. The results appear on the
# Security tab, under code scanning.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # v2.6.0 is held back: its Docker image on ghcr.io lost its manifests, so every pull
      # fails (https://github.com/ossf/scorecard-action/issues/1752). Go back to the newest
      # release once that issue is closed.
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
