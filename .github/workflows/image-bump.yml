# Once a week, looks for a newer build of Docker's Claude Code image. When there is one
# and tests/proof_container.py passes on it, opens a change that moves the pin in
# gate/settings.py to it. The pin is the digest of the multi-platform index, so the
# image keeps working on amd64 and arm64.
name: image-bump

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # push the branch with the new pin
      pull-requests: write   # open the change
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Find the newest build
        id: find
        run: |
          repo=docker/sandbox-templates:claude-code
          new=$(docker buildx imagetools inspect "$repo" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          old=$(python3 -c 'from gate.settings import DEFAULT_IMAGE; print(DEFAULT_IMAGE.split("@")[1])')
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "pinned $old, newest $new"
      - name: Move the pin and run the container proof
        if: steps.find.outputs.new != steps.find.outputs.old
        env:
          OLD: ${{ steps.find.outputs.old }}
          NEW: ${{ steps.find.outputs.new }}
          TOLLGATE_TEST_IMAGE_REQUIRED: "1"
        run: |
          sed -i "s/${OLD#sha256:}/${NEW#sha256:}/" gate/settings.py
          grep -q "${NEW#sha256:}" gate/settings.py
          image=$(python3 -c 'from gate.settings import DEFAULT_IMAGE; print(DEFAULT_IMAGE)')
          docker pull "$image"
          TOLLGATE_TEST_IMAGE="$image" python -m unittest tests.proof_container -v
      - name: Open the change
        if: steps.find.outputs.new != steps.find.outputs.old
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.find.outputs.new }}
        run: |
          branch="image-bump-${NEW#sha256:}"
          branch="${branch:0:24}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "a change for this build is already open"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "build(image): move the default image to ${NEW:0:19}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "build(image): move the default image to ${NEW:0:19}" \
            --body "Docker published a newer build of docker/sandbox-templates:claude-code. tests/proof_container.py passed on it in this run, so this moves the pin in gate/settings.py to ${NEW}."
