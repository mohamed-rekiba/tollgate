name: Tollgate
description: Run one Tollgate step - checks, prepare, freeze, or gate - from this pinned copy.
inputs:
  command:
    description: One of checks, prepare, freeze, gate, settings, plantag, review.
    required: true
  args:
    description: Arguments for the command.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/..
        TG_COMMAND: ${{ inputs.command }}
        TG_ARGS: ${{ inputs.args }}
      # The arguments come in through the environment and are split on spaces
      # only. The shell never reads them as code.
      run: |
        case "$TG_COMMAND" in
          checks|prepare|freeze|gate|settings|plantag|review) ;;
          *) echo "unknown command: $TG_COMMAND"; exit 2 ;;
        esac
        read -r -a args <<<"$TG_ARGS"
        # -P keeps the working folder, which may hold the change, off the import path.
        python3 -P -m "action.$TG_COMMAND" "${args[@]}"
